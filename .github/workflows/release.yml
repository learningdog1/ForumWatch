name: Release

on:
  push:
    tags:
      - 'v*'

# 默认最小权限；release job 单独提权 contents: write。
permissions:
  contents: read

jobs:
  build-mac:
    name: Build macOS (dmg)
    runs-on: macos-latest # arm64 runner；产出 arm64 dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest)
        run: npx vitest run

      - name: Build (electron-vite)
        run: npm run build

      - name: Package dmg (unsigned)
        # --publish never：tag 构建时 electron-builder 会隐式发布（要 GH_TOKEN，v27 起移除）；
        # 产物统一由下方 release job 用 softprops 挂到 Release，这里只打包。
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows (nsis)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest)
        run: npx vitest run

      - name: Build (electron-vite)
        run: npm run build

      - name: Package nsis installer (unsigned)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload nsis artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-nsis
          path: dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Attach artifacts to Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 检出仅为一件事：读 CHANGELOG.md 的最新版本段落做 release 说明
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 提取 CHANGELOG.md 顶部第一个 '## [' 版本段落作为 release 说明正文。
      # 取不到（没建 CHANGELOG / 忘记加本版段落）→ 硬失败：宁可构建失败，
      # 也不发一个没有更新说明的版本。
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk '/^## \[/{n++} n==1{print} n==2{exit}' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::CHANGELOG.md 顶部没有 '## [vX.Y.Z]' 版本段落——发版前必须先在 CHANGELOG.md 里写本版更新说明"
            exit 1
          fi
          head -5 release-body.md

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            artifacts/*.dmg
            artifacts/*-setup.exe
          generate_release_notes: true
