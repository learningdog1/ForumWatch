<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 应用图标小尺寸简化变体之 16px 专用档（preview 16 展示档，不落 resources/）。
       looker 复核返修：icon-simple.svg 的青点折算到 16px 后距环内缘仅 0.06px，
       与环顶描边熔成糊团——16 档去掉青点与圆心，与 Template 16 对齐只留「环 + 针」；
       青点保留在 64/32 档（icon-simple.svg）。几何同 icon-simple.svg。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="266" r="150" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <path d="M256 266 L366.88 225.64" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
</svg>
