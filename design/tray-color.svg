<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 彩色托盘（Windows 等，32 自然尺寸，渲染为 tray@2x.png）。
       looker 返修：简化为"单环 + 针 + 青点"（去扇形）；针端点 r=8.2，
       圆头帽尖 r=9.5 与环内缘（11-1.5）齐平不穿环；青点置于针上方留白处。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <circle cx="16" cy="16.5" r="11" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M16 16.5 L23.71 13.7" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="16" cy="16.5" r="2" fill="#FFFFFF"/>
  <circle cx="13.63" cy="11.42" r="2.5" fill="#22D3EE"/>
</svg>
